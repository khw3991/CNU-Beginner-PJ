<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickMovie - 가까운 상영관 찾기</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1 id="logo"><span class="logo-icon">🐛</span> Mopik 모픽 ┃ 모든 영화를 한눈에 pick!</h1>
        <nav id="breadcrumb"></nav>
    </header>

    <main id="app">

        <!-- ① 메인 페이지 -->
        <section id="main-page" class="page">
            <div class="main-top">
                <div id="mini-map-container">
                    <div id="map"></div>
                </div>
                <div class="popular-section">
                    <h2 class="section-title">━━━━━━━━━━━━━━━━━━━━    현재 인기 영화 TOP 10</h2>
                    <!-- 슬라이더 뷰포트: 넘치는 카드는 숨김 -->
                    <div class="slider-viewport">
                        <div id="popular-list" class="movie-row"></div>
                    </div>
                </div>
            </div>
            <div class="search-section">
                <button id="discover-btn">🎲 지금 볼 영화 찾기</button>
                <div class="search-bar-wrap">
                    <input type="text" id="search-input" placeholder="보고 싶은 영화를 검색하세요...">
                    <button id="search-btn">검색</button>
                </div>
            </div>
        </section>

        <!-- ② 영화 검색 페이지 -->
        <section id="search-page" class="page hidden">

            <!-- 상단 필터 바 -->
            <div class="filter-topbar">
                <div class="filter-topbar-inner">

                    <!-- 검색창 -->
                    <div class="search-bar-mini">
                        <input type="text" id="result-search-input" placeholder="영화 검색...">
                        <button id="result-search-btn">검색</button>
                    </div>

                    <!-- 날짜 -->
                    <div class="topbar-section">
                        <span class="topbar-label">날짜 <small>(없으면 전체)</small></span>
                        <div id="date-buttons-container" class="date-picker-row"></div>
                    </div>

                    <!-- 시간 범위 -->
                    <div class="topbar-section time-section">
                        <span class="topbar-label">시간 범위</span>
                        <div class="time-range-wrap">
                            <div class="dual-range-container">
                                <input type="range" id="time-min" min="0" max="1440" value="0" step="10">
                                <input type="range" id="time-max" min="0" max="1440" value="1440" step="10">
                                <div class="slider-track"></div>
                            </div>
                            <div class="time-range-display">
                                <input type="text" id="time-min-input" class="time-text-input" value="00:00" maxlength="5">
                                <span class="time-tilde">~</span>
                                <input type="text" id="time-max-input" class="time-text-input" value="24:00" maxlength="5">
                            </div>
                        </div>
                    </div>

                    <!-- 필터 초기화 -->
                    <button id="reset-filter-btn">✕ 초기화</button>

                </div>
            </div>

            <!-- 결과 영역 -->
            <div class="search-results-area">
                <div class="results-header">
                    <div class="results-header-left">
                        <span id="search-title">전체 영화</span>
                        <span id="result-count" class="result-count"></span>
                    </div>
                    <div class="sort-btns">
                        <button class="sort-btn active" data-sort="default">등록순</button>
                        <button class="sort-btn" data-sort="rating">평점순</button>
                    </div>
                </div>
                <div id="search-results" class="movie-grid"></div>
            </div>

        </section>

        <!-- ③ 영화 상세 페이지 -->
        <section id="detail-page" class="page hidden">
            <div class="detail-container">
                <div class="detail-left">
                    <img id="detail-poster" src="" alt="포스터">
                    <div class="detail-meta">
                        <span id="detail-rating" class="badge-rating"></span>
                        <span id="detail-audience" class="badge-audience"></span>
                    </div>
                </div>
                <div class="detail-right">
                    <h1 id="detail-title">영화 제목</h1>
                    <p class="section-sub">내 위치 기준 상영관 (거리순)</p>
                    <div class="filter-options">
                        <span class="filter-tag">거리 설정:</span>
                        <button class="dist-opt" data-dist="1">1km</button>
                        <button class="dist-opt active" data-dist="3">3km</button>
                        <button class="dist-opt" data-dist="5">5km</button>
                        <button class="dist-opt" data-dist="7">7km</button>
                    </div>
                    <div id="detail-filter-area"></div>
                    <div id="theater-list"></div>
                </div>
            </div>
        </section>
        <section id="theater-page" class="page hidden">
            <div class="theater-container" style="padding: 20px;">
                <button id="back-to-main-btn">← 지도로 돌아가기</button>

                <div class="theater-header" style="margin-bottom: 30px;">
                    <h1 id="selected-theater-name">극장 이름</h1>
                    <p id="selected-theater-info" class="section-sub">상세 주소 및 정보</p>
                </div>

                <div class="theater-movies-area">
                    <h2 class="section-title">현재 상영 중인 영화</h2>
                    <div id="theater-movie-list" class="movie-grid">
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCS0R14HglGfb2Di6WK587FKuxfy3n6ez4&libraries=places&language=ko"></script>
    <script src="cgv-showtimes.js"></script>
    <script src="script.js"></script>
</body>
</html>
